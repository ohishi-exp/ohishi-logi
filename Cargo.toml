[package]
name = "ohishi-logi"
version = "0.1.0"
edition = "2021"
description = "cam scrape 実処理 (Digest認証 SDカード巡回、Cloud Run バックエンド)"
publish = false

[dependencies]
axum = "0.8"
# カメラ SD CGI の Digest 認証 (RFC 2617 / MD5)。RustCrypto 系 pure Rust
md-5 = "0.10"
# カメラのディレクトリ一覧 XML のパース
quick-xml = "0.37"
# rustls 統一 (openssl 禁止)。webpki-roots 同梱 = scratch に CA store 不要
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

# scratch 極小イメージ向けのサイズ最適化 (rust-flickr / rust-alc-api と同方式)
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
